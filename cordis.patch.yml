# @snowamberx/dsh-role-router bundle patch: one insert row at the host plane.
#
# The `agent/request` and `system-prompt/assemble` listeners are registered on
# the root context, so they observe every agent — top-level and in-process
# subagents alike. Every role is optional: an unset role (the out-of-the-box
# default) follows the official model selector. Override this row's config
# from the profile's own cordis.patch.yml (addressed by row id `model-router`,
# last write wins) to pick the concrete routes.
- insert:
    - id: model-router
      name: '@snowamberx/dsh-role-router'
